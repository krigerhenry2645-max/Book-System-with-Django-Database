{% extends 'master.html' %}
{% load django_bootstrap5 %}

{% block title %}Edit Books{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-sm-4">
            <form action="{% url 'edit_book' form.instance.id %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
<!--                {{ form.as_p }}-->
                {% bootstrap_form form %}
                <button class="btn btn-danger w-100">update book</button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
